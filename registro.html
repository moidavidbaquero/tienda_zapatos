<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Crea tu cuenta UrbanStep." />
    <title>Registro | UrbanStep</title>
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body class="auth-body">
    <div id="toast" class="toast"></div>
    <main class="auth-page">
      <a class="logo auth-logo" href="index.html">URBAN<span>STEP</span></a>
      <div class="auth-card">
        <p class="eyebrow">CREAR CUENTA</p>
        <h1>Únete a UrbanStep</h1>
        <div id="auth-message" class="form-alert"></div>
        <form id="register-form" novalidate>
          <div class="form-grid two">
            <label
              >Nombre<input
                id="reg-name"
                required
                autocomplete="given-name" /><small
                class="field-error"
              ></small></label
            ><label
              >Apellido<input
                id="reg-lastname"
                required
                autocomplete="family-name" /><small class="field-error"></small
            ></label>
          </div>
          <label
            >Correo electrónico<input
              id="reg-email"
              type="email"
              required
              autocomplete="email" /><small class="field-error"></small></label
          ><label
            >Contraseña<input
              id="reg-password"
              type="password"
              minlength="6"
              required
              autocomplete="new-password" /><small
              class="field-error"
            ></small></label
          ><label
            >Confirmar contraseña<input
              id="reg-confirm"
              type="password"
              required
              autocomplete="new-password" /><small
              class="field-error"
            ></small></label
          ><button class="btn btn-primary btn-block" type="submit">
            Crear cuenta
          </button>
        </form>
        <p class="auth-switch">
          ¿Ya tienes una cuenta? <a href="login.html">Iniciar sesión</a>
        </p>
        <p class="demo-note">
          Solo demostración frontend. En producción se requiere backend, hash de
          contraseñas, sesiones seguras y controles de seguridad.
        </p>
      </div>
    </main>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
