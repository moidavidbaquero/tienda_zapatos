<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Inicia sesión en UrbanStep." />
    <title>Iniciar sesión | UrbanStep</title>
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body class="auth-body">
    <div id="toast" class="toast"></div>
    <main class="auth-page">
      <a class="logo auth-logo" href="index.html">URBAN<span>STEP</span></a>
      <div class="auth-card">
        <p class="eyebrow">MI CUENTA</p>
        <h1>Bienvenido de nuevo</h1>
        <p class="muted">
          Inicia sesión para guardar tus preferencias y consultar tu experiencia
          de compra.
        </p>
        <div id="auth-message" class="form-alert"></div>
        <form id="login-form" novalidate>
          <label
            >Correo electrónico<input
              id="login-email"
              type="email"
              required
              autocomplete="email" /><small class="field-error"></small></label
          ><label
            >Contraseña<input
              id="login-password"
              type="password"
              required
              autocomplete="current-password" /><small
              class="field-error"
            ></small></label
          ><button class="btn btn-primary btn-block" type="submit">
            Iniciar sesión
          </button>
        </form>
        <p class="auth-switch">
          ¿No tienes una cuenta? <a href="registro.html">Crear cuenta</a>
        </p>
        <p class="demo-note">
          Demostración frontend: los datos se almacenan localmente y no deben
          usarse para credenciales reales.
        </p>
      </div>
    </main>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
